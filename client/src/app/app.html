@if (loading()) {
  <main class="angular-error" aria-live="polite"><h1>Opening your workspace…</h1><p>Connecting to the reception server.</p></main>
} @else if (startupError()) {
  <main class="angular-error" role="alert"><h1>Visitor workspace unavailable</h1><p>{{ startupError() }}</p><button type="button" class="button primary" (click)="ngOnInit()">Retry</button></main>
} @else {
  <router-outlet />
}
